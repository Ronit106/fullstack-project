<html lang="en">

    <body>
        <div id="card">
    
        <button id = "darkbtn" >Dark mode</button>
        <h1>Todo List</h1>
        <input type="text" id="input" placeholder="Add a new task" size="30">
        <button id="addBtn">Add</button>
        <hr>
        <input type="text" id="search" placeholder="search task" size="30">
        <br>
        <button id = "Completed">Completed</button>
        <button id = "Active">Active</button>
        <button id = "All"> Show all</button>
        <ul style="text-align: left;"> - YOUR  TASK </ul>
        <h4 id="taskCount"style="text-align:bottomleft;" > Total task added : 0 </h4>
        <button id="clearBtn">Clear All</button>



        <script src="script.js"></script>
        </div>
    </body>
